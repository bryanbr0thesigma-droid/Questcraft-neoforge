[package]
name = "horizon-quest"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish = false
description = "Horizon on Meta Quest (QuestCraft): the game as an Android NativeActivity"

# The library Android's NativeActivity loads: Horizon's own game (horizon-client's entry), started
# with the arguments QuestCraft's launcher hands over and winit's Android backend.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["audio"]
audio = ["horizon-client/audio"]

[dependencies]
# Not its controllers (gilrs, the DualSense's HID): the Quest's come through OpenXR.
horizon-client = { path = "../horizon-client", default-features = false, features = ["horizon-extras"] }
horizon-threads = { path = "../horizon-threads" }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }

[lints]
workspace = true
